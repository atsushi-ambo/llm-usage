[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-usage"
version = "0.1.0"
description = "Unified dashboard for LLM usage across Claude, OpenAI, Grok (xAI), Cursor, and Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Atsushi Ambo" }]
keywords = ["llm", "usage", "cost", "claude", "openai", "grok", "cursor", "gemini"]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.27.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.0",
  "fastapi>=0.139.0",
  "uvicorn[standard]>=0.51.0",
  "jinja2>=3.1",
  "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.6"]

[project.scripts]
llm-usage = "llm_usage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_usage"]

[tool.hatch.build.targets.sdist]
include = ["src/llm_usage", "README.md", "pyproject.toml", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
