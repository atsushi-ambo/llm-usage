<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llm-usage</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --border: #1e2a3a;
      --text: #e7eef7;
      --muted: #8b9bb0;
      --accent: #5b9dff;
      --green: #3dd68c;
      --yellow: #f5c542;
      --red: #ff6b6b;
      --claude: #d4a27f;
      --openai: #10a37f;
      --grok: #a78bfa;
      --cursor: #60a5fa;
      --gemini: #fbbf24;
      --codex: #22c55e;
      --openrouter: #2dd4bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152238 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      background: rgba(11, 15, 20, 0.85);
      z-index: 10;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    .controls { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    select, button, input[type="date"] {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .75rem;
      font-size: .9rem;
    }
    input[type="date"] {
      color-scheme: dark;
    }
    button {
      cursor: pointer;
      background: linear-gradient(180deg, #2a6fdb, #1f5bbd);
      border-color: #3b7de8;
    }
    button:hover { filter: brightness(1.08); }
    .filter-controls {
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .filter-controls label {
      color: var(--muted);
      font-size: .85rem;
    }
    .chart-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1rem;
      height: 300px;
    }
    .cost-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .forecast-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
    }
    .budget-alert {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid var(--red);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .budget-alert.warning {
      background: rgba(245, 197, 66, 0.1);
      border-color: var(--yellow);
    }
    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .section-title {
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 0 0 .75rem;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .estimate-footnote {
      color: var(--muted);
      font-size: .8rem;
      margin: -0.75rem 0 1.25rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.15rem;
    }
    .card .label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
    .card .value { font-size: 1.55rem; font-weight: 650; margin-top: .35rem; letter-spacing: -0.03em; }
    .card .sub { color: var(--muted); font-size: .8rem; margin-top: .25rem; }
    .providers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
    }
    .provider { position: relative; overflow: hidden; }
    .provider::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent);
    }
    .provider.claude::before { background: var(--claude); }
    .provider.openai::before { background: var(--openai); }
    .provider.codex::before { background: var(--codex); }
    .provider.grok::before { background: var(--grok); }
    .provider.cursor::before { background: var(--cursor); }
    .provider.gemini::before { background: var(--gemini); }
    .provider.openrouter::before { background: var(--openrouter); }
    .provider h2 {
      margin: 0 0 .35rem;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      gap: .5rem;
      align-items: center;
    }
    .badge {
      font-size: .7rem;
      padding: .15rem .45rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }
    .badge.api { color: var(--green); border-color: #245c42; }
    .badge.local_logs { color: var(--accent); border-color: #2a4a74; }
    .badge.subscription { color: #d8b4fe; border-color: #5b3a7a; }
    .badge.unavailable { color: var(--muted); }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem .75rem;
      margin: .85rem 0;
      font-size: .9rem;
    }
    .metrics div span { display: block; color: var(--muted); font-size: .72rem; }

    /* ── Quota bars (Grok-settings style) ───────────────────── */
    .quota-block {
      margin: .85rem 0 1rem;
      padding: .85rem 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .quota-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .75rem;
      margin-bottom: .55rem;
      flex-wrap: wrap;
    }
    .quota-pct {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .quota-pct small {
      font-size: .85rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: .25rem;
    }
    .quota-reset {
      color: var(--muted);
      font-size: .8rem;
      text-align: right;
    }
    .quota-track {
      height: 12px;
      background: #1a2433;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .quota-fill {
      display: block;
      height: 100%;
      border-radius: 99px;
      transition: width .35s ease;
      min-width: 0;
    }
    .quota-meta {
      display: flex;
      justify-content: space-between;
      gap: .5rem;
      margin-top: .55rem;
      font-size: .78rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .quota-meta strong { color: var(--text); font-weight: 600; }
    .quota-ok { color: var(--green); }
    .quota-warn { color: var(--yellow); }
    .quota-hot { color: var(--red); }

    .sparkline-block { margin: .7rem 0; }
    .sparkline-label {
      color: var(--muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .3rem;
    }
    .sparkline-svg { width: 100%; height: 28px; display: block; }

    .models { margin-top: .5rem; }
    .models table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .models th, .models td { text-align: left; padding: .3rem 0; border-bottom: 1px solid var(--border); }
    .models th { color: var(--muted); font-weight: 500; }
    .models td:not(:first-child), .models th:not(:first-child) { text-align: right; }
    .notes { color: var(--muted); font-size: .78rem; margin-top: .65rem; line-height: 1.4; }
    .notes .err { color: var(--yellow); }
    .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; }
    footer { text-align: center; color: var(--muted); font-size: .75rem; padding: 2rem 1rem; }
    #status { color: var(--muted); font-size: .8rem; }

    .provider.cohere::before { background: #00b4d8; }
    .provider.mistral::before { background: #ff6b35; }
    .provider.replicate::before { background: #6366f1; }
    .provider.huggingface::before { background: #ffd93d; }
    .muted-note { color: var(--muted); margin: 0; font-size: .9rem; }
    .cost-row { margin-bottom: .75rem; }
    .cost-row-head {
      display: flex; justify-content: space-between; gap: .5rem;
      font-size: .85rem; margin-bottom: .3rem;
    }
    .usage-svg { width: 100%; height: 220px; display: block; }
    .chart-caption { color: var(--muted); font-size: .75rem; margin-top: .5rem; }
    .chart-container { height: auto; min-height: 120px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>llm-<span>usage</span></h1>
    <div class="controls">
      <span id="status">Loading…</span>
      <select id="days">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="custom">Custom range</option>
      </select>
      <input type="date" id="date-start" hidden>
      <input type="date" id="date-end" hidden>
      <button id="refresh">Refresh</button>
      <button id="export-csv">Export CSV</button>
      <button id="export-pdf">Export PDF</button>
    </div>
  </header>
  <main>
    <div id="budget-alerts"></div>
    <p class="section-title">Overview</p>
    <section class="summary" id="summary"></section>
    <p class="estimate-footnote" id="estimate-footnote" hidden></p>
    <p class="section-title">Cost Breakdown</p>
    <section class="cost-breakdown" id="cost-breakdown"></section>
    <p class="section-title">Usage Trends</p>
    <div class="chart-container" id="usage-chart"></div>
    <p class="section-title">Forecast</p>
    <section class="forecast-card" id="forecast"></section>
    <div class="filter-controls">
      <label>Filter by provider:</label>
      <select id="provider-filter">
        <option value="all">All providers</option>
      </select>
      <label>Sort by:</label>
      <select id="sort-by">
        <option value="cost">Cost</option>
        <option value="tokens">Tokens</option>
        <option value="requests">Requests</option>
      </select>
    </div>
    <p class="section-title">Providers</p>
    <section class="providers" id="providers"></section>
  </main>
  <footer>Local-only · data stays on your machine · llm-usage</footer>
  <script src="/static/app.js" defer></script>
</body>
</html>
