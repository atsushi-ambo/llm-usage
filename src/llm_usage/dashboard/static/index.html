<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>llm-usage</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --panel-2: #1a2030;
      --border: #2a3344;
      --text: #eef2f8;
      --muted: #8b95a8;
      --accent: #e60012;
      --accent-2: #ff4d5a;
      --green: #3dd68c;
      --yellow: #e8b84a;
      --red: #ff6b6b;
      --sky: #5b9dff;
      --claude: #e8a07c;
      --openai: #2ec9a0;
      --grok: #9b8cff;
      --cursor: #5b9dff;
      --gemini: #e8c14a;
      --codex: #3ddc8a;
      --openrouter: #2dd4c0;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent-2);
      --font-ui: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-ui);
      background:
        radial-gradient(1100px 520px at 12% -12%, #1a1020 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .skip {
      position: absolute;
      left: -999px;
      top: 0;
      background: var(--accent);
      color: #fff;
      padding: .5rem .8rem;
      z-index: 100;
      border-radius: 0 0 8px 0;
    }
    .skip:focus { left: 0; }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(11, 13, 18, 0.88);
      backdrop-filter: blur(12px);
      color: var(--text);
      z-index: 10;
    }
    .brand h1 {
      font-size: 1.15rem;
      margin: 0;
      letter-spacing: -0.03em;
      font-weight: 650;
    }
    .brand h1 span { color: var(--accent); }
    #status {
      color: var(--muted);
      font-size: .8rem;
      margin: .25rem 0 0;
      min-height: 1.1em;
    }
    .controls {
      display: flex;
      gap: .5rem;
      align-items: flex-end;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .ctrl {
      display: flex;
      flex-direction: column;
      gap: .2rem;
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    select, button, input[type="date"] {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .75rem;
      font-size: .9rem;
    }
    input[type="date"] { color-scheme: dark; }
    button {
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled { opacity: .55; cursor: progress; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: #ff2a3a;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-ghost {
      background: var(--panel);
      border-color: var(--border);
      font-weight: 500;
      color: var(--text);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent-2); }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    .custom-dates {
      display: flex;
      gap: .5rem;
      align-items: flex-end;
    }
    main { padding: 1.35rem 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }
    .section-title {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 0 0 .65rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .75rem;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .estimate-footnote {
      color: var(--muted);
      font-size: .8rem;
      margin: -0.5rem 0 1.15rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
    }
    .card .label {
      color: var(--muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .card .value { font-size: 1.5rem; font-weight: 650; margin-top: .35rem; letter-spacing: -0.03em; }
    .card .sub { color: var(--muted); font-size: .8rem; margin-top: .25rem; }

    .quota-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: .75rem;
      margin-bottom: 1.35rem;
    }
    .quota-chip {
      display: block;
      text-align: left;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem .9rem;
      cursor: pointer;
      font: inherit;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .quota-chip::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
    }
    .quota-chip:hover { border-color: #3d4a60; }
    .quota-chip .qc-name { font-size: .8rem; color: var(--muted); }
    .quota-chip .qc-pct { font-size: 1.25rem; font-weight: 700; letter-spacing: -.03em; margin: .15rem 0; }
    .quota-chip .qc-meta { font-size: .75rem; color: var(--muted); }
    .quota-chip.claude::before { background: var(--claude); }
    .quota-chip.openai::before, .quota-chip.codex::before { background: var(--codex); }
    .quota-chip.grok::before { background: var(--grok); }
    .quota-chip.cursor::before { background: var(--cursor); }
    .quota-chip.gemini::before { background: var(--gemini); }
    .quota-chip.openrouter::before { background: var(--openrouter); }

    .toolbar {
      display: flex;
      gap: .75rem;
      align-items: flex-end;
      flex-wrap: wrap;
      margin: 0 0 1rem;
      padding: .75rem .9rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .toolbar .ctrl { min-width: 140px; }
    .toggle {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .85rem;
      color: var(--muted);
      margin-left: auto;
      cursor: pointer;
      user-select: none;
      padding-bottom: .15rem;
    }
    .toggle input { accent-color: var(--accent); }
    .providers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1rem;
    }
    .provider { position: relative; overflow: hidden; scroll-margin-top: 5.5rem; }
    .provider::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent);
    }
    .provider.claude::before { background: var(--claude); }
    .provider.openai::before { background: var(--openai); }
    .provider.codex::before { background: var(--codex); }
    .provider.grok::before { background: var(--grok); }
    .provider.cursor::before { background: var(--cursor); }
    .provider.gemini::before { background: var(--gemini); }
    .provider.openrouter::before { background: var(--openrouter); }
    .provider.cohere::before { background: #3ba3e8; }
    .provider.mistral::before { background: #f07167; }
    .provider.replicate::before { background: #8b85f0; }
    .provider.huggingface::before { background: #e0c040; }
    .provider h2 {
      margin: 0 0 .35rem;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      gap: .5rem;
      align-items: center;
    }
    .badge {
      font-size: .7rem;
      padding: .15rem .45rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }
    .badge.api { color: var(--green); border-color: #245c42; }
    .badge.local_logs { color: var(--sky); border-color: #2a4a74; }
    .badge.subscription { color: #c4b5fd; border-color: #5b3a7a; }
    .badge.unavailable { color: var(--muted); }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem .75rem;
      margin: .85rem 0;
      font-size: .9rem;
    }
    .metrics div span { display: block; color: var(--muted); font-size: .72rem; }

    .quota-block {
      margin: .85rem 0 1rem;
      padding: .85rem 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .quota-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .75rem;
      margin-bottom: .55rem;
      flex-wrap: wrap;
    }
    .quota-pct {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .quota-pct small {
      font-size: .85rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: .25rem;
    }
    .quota-reset {
      color: var(--muted);
      font-size: .8rem;
      text-align: right;
    }
    .quota-track {
      height: 10px;
      background: #1a2433;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .quota-fill {
      display: block;
      height: 100%;
      border-radius: 99px;
      transition: width .35s ease;
      min-width: 0;
    }
    .quota-meta {
      display: flex;
      justify-content: space-between;
      gap: .5rem;
      margin-top: .55rem;
      font-size: .78rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .quota-meta strong { color: var(--text); font-weight: 600; }
    .quota-ok { color: var(--green); }
    .quota-warn { color: var(--yellow); }
    .quota-hot { color: var(--red); }
    .quota-burn {
      margin-top: .55rem;
      font-size: .8rem;
      line-height: 1.35;
    }

    .sparkline-block { margin: .7rem 0; }
    .sparkline-label {
      color: var(--muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .3rem;
    }
    .sparkline-svg { width: 100%; height: 28px; display: block; }

    .models { margin-top: .5rem; overflow-x: auto; }
    .models table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .models th, .models td { text-align: left; padding: .3rem 0; border-bottom: 1px solid var(--border); }
    .models th { color: var(--muted); font-weight: 500; }
    .models td:not(:first-child), .models th:not(:first-child) { text-align: right; }
    .notes { color: var(--muted); font-size: .78rem; margin-top: .65rem; line-height: 1.4; }
    .notes .err { color: var(--yellow); }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 2.4rem 1.2rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: rgba(255,255,255,.02);
    }
    .empty strong { color: var(--text); display: block; margin-bottom: .35rem; }
    footer { text-align: center; color: var(--muted); font-size: .75rem; padding: 2rem 1rem; }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .7rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .05rem .3rem;
      color: var(--muted);
    }

    .muted-note { color: var(--muted); margin: 0; font-size: .9rem; }
    .cost-row { margin-bottom: .75rem; }
    .cost-row-head {
      display: flex; justify-content: space-between; gap: .5rem;
      font-size: .85rem; margin-bottom: .3rem;
    }
    .usage-svg { width: 100%; height: 220px; display: block; }
    .chart-caption { color: var(--muted); font-size: .75rem; margin-top: .5rem; }
    .chart-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.25rem;
      height: auto;
      min-height: 120px;
    }
    .cost-breakdown {
      display: grid;
      grid-template-columns: 1fr;
      gap: .25rem;
      margin-bottom: 1.35rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
    }
    .forecast-card {
      background: linear-gradient(135deg, rgba(230, 0, 18, 0.08), rgba(155, 140, 255, 0.08));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.35rem;
    }
    .budget-alert {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid var(--red);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .budget-alert.warning {
      background: rgba(232, 184, 74, 0.1);
      border-color: var(--yellow);
    }
    .budget-alert p { margin: .35rem 0 0; color: var(--muted); font-size: .9rem; }
    a { color: var(--sky); }
    body.is-loading main { opacity: .72; pointer-events: none; }
    .hidden { display: none !important; }

    @media (max-width: 720px) {
      header { flex-direction: column; padding: .9rem 1rem; }
      .controls { justify-content: flex-start; width: 100%; }
      main { padding: 1rem; }
      .toggle { margin-left: 0; }
      .quota-pct { font-size: 1.25rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="brand">
      <h1>llm-<span>usage</span></h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
    </div>
    <div class="controls">
      <label class="ctrl">
        Period
        <select id="days" aria-label="Lookback period">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="custom">Custom range</option>
        </select>
      </label>
      <div id="custom-dates" class="custom-dates hidden">
        <label class="ctrl">From <input type="date" id="date-start" aria-label="Start date"></label>
        <label class="ctrl">To <input type="date" id="date-end" aria-label="End date"></label>
      </div>
      <button id="refresh" class="btn-primary" type="button">Refresh</button>
      <button id="export-csv" class="btn-ghost" type="button">CSV</button>
      <button id="export-pdf" class="btn-ghost" type="button">Print</button>
    </div>
  </header>
  <main id="main">
    <div id="budget-alerts"></div>
    <h2 class="section-title" id="quota-strip-title" hidden>Live quotas</h2>
    <section class="quota-strip" id="quota-strip" hidden></section>
    <h2 class="section-title">Overview</h2>
    <section class="summary" id="summary"></section>
    <p class="estimate-footnote" id="estimate-footnote" hidden></p>
    <div id="cost-section" hidden>
      <h2 class="section-title">Cost breakdown</h2>
      <section class="cost-breakdown" id="cost-breakdown"></section>
    </div>
    <div id="trends-section" hidden>
      <h2 class="section-title">Usage trends</h2>
      <div class="chart-container" id="usage-chart"></div>
    </div>
    <div id="forecast-section" hidden>
      <h2 class="section-title">Forecast</h2>
      <section class="forecast-card" id="forecast"></section>
    </div>
    <div class="toolbar">
      <label class="ctrl">Provider
        <select id="provider-filter" aria-label="Filter by provider">
          <option value="all">All providers</option>
        </select>
      </label>
      <label class="ctrl">Sort by
        <select id="sort-by" aria-label="Sort providers">
          <option value="quota">Quota used</option>
          <option value="cost">Cost</option>
          <option value="tokens">Tokens</option>
          <option value="requests">Requests</option>
        </select>
      </label>
      <label class="toggle">
        <input type="checkbox" id="hide-na" checked>
        Hide inactive
      </label>
    </div>
    <h2 class="section-title">Providers</h2>
    <section class="providers" id="providers"></section>
  </main>
  <footer>
    Local-only · data stays on your machine · llm-usage
    · <span class="kbd">R</span> refresh
    · <span class="kbd">1</span>–<span class="kbd">4</span> period
  </footer>
  <script src="/static/app.js" defer></script>
</body>
</html>
